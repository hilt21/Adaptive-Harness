name: ci

on:
  push:
  pull_request:

jobs:
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: docker build --tag adaptive-harness-quickstart -f .devcontainer/Dockerfile .devcontainer
      - run: >-
          docker run --rm
          --user vscode
          --mount type=bind,source="$PWD",target=/source,readonly
          adaptive-harness-quickstart
          sh /source/.devcontainer/smoke-post-create.sh
      - run: uv sync --dev --locked
      - run: uv run python scripts/smoke-quickstart.py

  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
        env:
          HARNESS_RUN_OS_SANDBOX_E2E: "1"
      - run: uv build
